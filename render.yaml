services:
  - type: web
    name: human-provenance-standard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://human-provenance-standard.onrender.com"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HPS_REGISTRY_PUBLIC_KEY
        sync: false
      - key: HPS_REGISTRY_SECRET_KEY
        sync: false
