<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HPS Research Agent</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{font:14px system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:16px;width:360px;background:#0b0d10;color:#f7f7f5}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .mark{width:34px;height:34px;border-radius:11px;background:#c81e1e;color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
    h1{font-size:18px;margin:0}
    .muted{opacity:.68;font-size:12px;line-height:1.45}
    .section{margin-top:14px;padding-top:12px;border-top:1px solid #242932}
    button,input,textarea{box-sizing:border-box;width:100%;margin-top:9px;border-radius:10px;border:1px solid #363b43;background:#15181d;color:#fff;padding:10px}
    button{cursor:pointer;font-weight:750;background:#f4f1e8;color:#111}
    button.primary{background:#c81e1e;color:white;border-color:#c81e1e}
    button.secondary{background:#15181d;color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .count{margin-top:12px;padding:9px;border:1px solid #2b3037;border-radius:10px}
    .ok{font-size:12px;margin-top:8px;min-height:16px;color:#d7e8d7}
    .review{font-size:12px;margin-top:8px;opacity:.85}
  </style>
</head>
<body>
  <div class="brand">
    <div class="mark">H</div>
    <div>
      <h1>HPS Research Agent</h1>
      <div class="muted">Human-approved provenance capture</div>
    </div>
  </div>

  <div class="muted">Nothing is captured automatically. Save only research events you want in the provenance trail.</div>

  <button id="saveSource">Save current page as source</button>

  <div class="section">
    <input id="tool" placeholder="AI tool, e.g. ChatGPT" />
    <textarea id="task" rows="3" placeholder="Describe the AI assistance you want to disclose"></textarea>
    <button id="saveAi" class="secondary">Record AI assistance</button>
    <button id="reviewAi" class="secondary">Human-review latest AI event</button>
    <div id="reviewState" class="review"></div>
  </div>

  <div class="section">
    <button id="checkpoint" class="secondary">Create checkpoint</button>
    <button id="sendHps" class="primary">Send trail to HPS</button>
    <button id="export" class="secondary">Export trail JSON</button>
  </div>

  <div id="count" class="count">0 provenance events</div>
  <div id="status" class="ok"></div>

  <script src="popup.js"></script>
</body>
</html>
